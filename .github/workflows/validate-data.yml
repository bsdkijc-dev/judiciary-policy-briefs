name: Validate Judicial Data

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy matplotlib

      - name: Run automated schema and reconciliation checks
        run: python3 scripts/validate_data.py

      - name: Verify statistics generation
        run: python3 scripts/generate_statistics.py
